<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SIGNALIS-OS // ARIS-9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Ajustes para rodar no browser (sem frame nativo do Electron) */
    #titlebar { -webkit-app-region: none; cursor: default; }
    body { overflow: hidden; }
    #auth-overlay { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:#05090d; }
    #auth-overlay[hidden] { display:none; }
    .auth-card { width:320px; padding:28px; border:1px solid #1d89a8; background:#09141b; box-shadow:0 0 30px rgba(0,240,255,.18); font-family:'Share Tech Mono',monospace; color:#d9faff; }
    .auth-card h1 { font-size:18px; margin:0 0 18px; color:#6ee7f9; }
    .auth-card input { box-sizing:border-box; width:100%; margin:7px 0; padding:10px; color:#d9faff; background:#05090d; border:1px solid #276f80; font:inherit; }
    .auth-card button { width:100%; margin-top:12px; padding:10px; cursor:pointer; color:#071116; background:#6ee7f9; border:0; font:inherit; }
    #auth-error { min-height:18px; margin:8px 0 0; color:#ff8090; font-size:12px; }
    #remote-access-toggle.remote-active { color:#8cffb2; }
    #unlimited-steps-toggle.unlimited-active { color:#f9c74f; }
  </style>
</head>
<body>
  <div id="auth-overlay" hidden>
    <form id="auth-form" class="auth-card">
      <h1>SIGNALIS-OS // ACESSO PROTEGIDO</h1>
      <input id="auth-username" autocomplete="username" placeholder="usuário" required>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="senha" required>
      <button type="submit">ENTRAR NO SISTEMA</button>
      <div id="auth-error"></div>
    </form>
  </div>

  <!-- ── BARRA DE TÍTULO ──────────────────────────────────── -->
  <div id="titlebar">
    <span id="titlebar-title">SIGNALIS-OS // ARIS-9 // BROWSER MODE</span>
    <div id="titlebar-controls">
      <button class="win-ctrl" onclick="api.minimize()" title="Minimizar">─</button>
      <button class="win-ctrl" onclick="api.maximize()" title="Maximizar">□</button>
      <button class="win-ctrl close" onclick="api.close()" title="Fechar">✕</button>
    </div>
  </div>

  <!-- ── DESKTOP ─────────────────────────────────────────── -->
  <div id="desktop" style="margin-top:28px;">
    <div id="wallpaper"></div>
    <div id="windows-container"></div>
  </div>

  <!-- ── TASKBAR ─────────────────────────────────────────── -->
  <div id="taskbar">
    <button class="taskbar-btn" onclick="openTerminal()">[ TERMINAL ]</button>
    <button class="taskbar-btn" onclick="openSysMon()">[ SYSMON ]</button>
    <button class="taskbar-btn" id="remote-access-toggle">[ ACESSO REMOTO: DESATIVADO ]</button>
    <button class="taskbar-btn" id="unlimited-steps-toggle">[ AÇÕES ILIMITADAS: DESATIVADO ]</button>
    <button class="taskbar-btn" id="btn-wallpaper" onclick="toggleWallpaper()">[ WALLPAPER ON ]</button>
    <span class="taskbar-clock" id="clock">00:00:00</span>
  </div>

  <!-- ── TEMPLATE: TERMINAL ──────────────────────────────── -->
  <template id="tpl-terminal">
    <div class="os-window" style="width:680px;height:420px;top:60px;left:60px;">
      <div class="os-window-titlebar" data-drag>
        <span class="os-window-title">TERMINAL // ARIS-9</span>
        <button class="win-ctrl" data-action="minimize">─</button>
        <button class="win-ctrl close" data-action="close">✕</button>
      </div>
      <div class="os-window-body">
        <div class="terminal-output" id="terminal-output"></div>
        <div class="terminal-input-row">
          <span class="terminal-prefix" id="terminal-prefix">ARIS@OS ~$</span>
          <input type="text" id="terminal-input" autocomplete="off" spellcheck="false"
                 placeholder="comando ou mensagem para o ARIS-9...">
        </div>
      </div>
    </div>
  </template>

  <!-- ── TEMPLATE: MONITOR DE SISTEMA ───────────────────── -->
  <template id="tpl-sysmon">
    <div class="os-window" style="width:360px;height:310px;top:60px;left:780px;">
      <div class="os-window-titlebar" data-drag>
        <span class="os-window-title">MONITOR DE SISTEMA</span>
        <button class="win-ctrl" data-action="minimize">─</button>
        <button class="win-ctrl close" data-action="close">✕</button>
      </div>
      <div class="os-window-body sysmon-body">
        <div class="sysmon-row">
          <label>CPU</label>
          <div class="progress-bar"><div class="progress-fill" id="sm-cpu-bar" style="width:0%"></div></div>
          <div class="sysmon-value" id="sm-cpu-val">—</div>
        </div>
        <div class="sysmon-row">
          <label>RAM</label>
          <div class="progress-bar"><div class="progress-fill" id="sm-ram-bar" style="width:0%"></div></div>
          <div class="sysmon-value" id="sm-ram-val">—</div>
        </div>
        <div class="sysmon-row">
          <label>DISCO</label>
          <div class="progress-bar"><div class="progress-fill" id="sm-disk-bar" style="width:0%"></div></div>
          <div class="sysmon-value" id="sm-disk-val">—</div>
        </div>
        <div class="sysmon-grid">
          <div>HOST</div>   <span id="sm-host">...</span>
          <div>CPU</div>    <span id="sm-cpu-model">...</span>
          <div>CORES</div>  <span id="sm-cores">...</span>
          <div>UPTIME</div> <span id="sm-uptime">...</span>
        </div>
      </div>
    </div>
  </template>

  <!-- ── CONTAINER DE NOTIFICAÇÕES (TOAST) ──────────────── -->
  <div id="notification-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ── SCRIPTS ─────────────────────────────────────────── -->
  <!-- 1. mock-api.js PRIMEIRO — cria window.api antes de tudo -->
  <script src="js/mock-api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/core/permissions.js"></script>
  <script src="js/core/ToolManager.js"></script>
  <script>
    window.toolsReady = window.signalisAuth.whenAuthenticated()
      .then(() => window.toolManager.discover())
      .catch(error => console.warn('[SIGNALIS-OS] Falha ao carregar tools:', error))
  </script>
  <script src="js/agent.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/sysmon.js"></script>
  <script src="js/desktop.js"></script>

  <script>
    // ── Ações Ilimitadas ──────────────────────────────────────
    window.UNLIMITED_STEPS = false

    function _setUnlimitedSteps(enabled) {
      window.UNLIMITED_STEPS = enabled
      const btn = document.getElementById('unlimited-steps-toggle')
      if (!btn) return
      btn.textContent = enabled ? '[ AÇÕES ILIMITADAS: ATIVO ]' : '[ AÇÕES ILIMITADAS: DESATIVADO ]'
      btn.classList.toggle('unlimited-active', enabled)
    }

    document.getElementById('unlimited-steps-toggle').addEventListener('click', () => {
      _setUnlimitedSteps(!window.UNLIMITED_STEPS)
    })

    // Ativa automaticamente para usuário GOD ao autenticar
    window.signalisAuth.whenAuthenticated().then(status => {
      if (status?.permissionLevel === 'god') {
        _setUnlimitedSteps(true)
      }
    })

    // Abre o terminal automaticamente ao carregar
    window.addEventListener('load', () => {
      window.toolsReady.then(() => setTimeout(openTerminal, 300))
    })
  </script>

</body>
</html>
