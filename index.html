<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05090d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SIGNALIS-OS // ARIS-9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Ajustes para rodar no browser (sem frame nativo do Electron) */
    #titlebar { -webkit-app-region: none; cursor: default; }
    body { overflow: hidden; }
    #auth-overlay { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:#05090d; }
    #auth-overlay[hidden] { display:none; }
    .auth-card { width:320px; padding:28px; border:1px solid #1d89a8; background:#09141b; box-shadow:0 0 30px rgba(0,240,255,.18); font-family:'Share Tech Mono',monospace; color:#d9faff; }
    .auth-card h1 { font-size:18px; margin:0 0 18px; color:#6ee7f9; }
    .auth-card input { box-sizing:border-box; width:100%; margin:7px 0; padding:10px; color:#d9faff; background:#05090d; border:1px solid #276f80; font:inherit; }
    .auth-card button { width:100%; margin-top:12px; padding:10px; cursor:pointer; color:#071116; background:#6ee7f9; border:0; font:inherit; }
    #auth-error { min-height:18px; margin:8px 0 0; color:#ff8090; font-size:12px; }
    #remote-access-toggle.remote-active { color:#8cffb2; }
    #unlimited-steps-toggle.unlimited-active { color:#f9c74f; }
  </style>
</head>
<body>
  <div id="auth-overlay" hidden>
    <form id="auth-form" class="auth-card">
      <h1>SIGNALIS-OS // ACESSO PROTEGIDO</h1>
      <input id="auth-username" autocomplete="username" placeholder="usuário" required>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="senha" required>
      <button type="submit">ENTRAR NO SISTEMA</button>
      <div id="auth-error"></div>
    </form>
  </div>

  <!-- ── BARRA DE TÍTULO ──────────────────────────────────── -->
  <div id="titlebar">
    <button id="mobile-menu-btn" data-testid="mobile-menu-btn" class="win-ctrl" aria-label="Abrir menu" title="Menu" onclick="window.toggleMobileDrawer && window.toggleMobileDrawer()">☰</button>
    <span id="titlebar-title">SIGNALIS-OS // ARIS-9 // BROWSER MODE</span>
    <div id="titlebar-controls">
      <button class="win-ctrl" onclick="api.minimize()" title="Minimizar">─</button>
      <button class="win-ctrl" onclick="api.maximize()" title="Maximizar">□</button>
      <button class="win-ctrl close" onclick="api.close()" title="Fechar">✕</button>
    </div>
  </div>

  <!-- ── DRAWER MÓVEL ────────────────────────────────────── -->
  <div id="mobile-drawer-backdrop" data-testid="mobile-drawer-backdrop" onclick="window.closeMobileDrawer && window.closeMobileDrawer()"></div>
  <aside id="mobile-drawer" data-testid="mobile-drawer" aria-label="Menu principal">
    <header class="drawer-header">
      <span>SIGNALIS-OS</span>
      <button class="win-ctrl" aria-label="Fechar menu" onclick="window.closeMobileDrawer && window.closeMobileDrawer()">✕</button>
    </header>
    <nav class="drawer-nav">
      <button class="drawer-btn" data-drawer-action="terminal" data-testid="drawer-btn-terminal">[ TERMINAL ]</button>
      <button class="drawer-btn" data-drawer-action="sysmon" data-testid="drawer-btn-sysmon">[ MONITOR DE SISTEMA ]</button>
      <button class="drawer-btn" data-drawer-action="workspaces" data-testid="drawer-btn-workspaces">[ WORKSPACES ]</button>
      <button class="drawer-btn" data-drawer-action="macros" data-testid="drawer-btn-macros">[ MACROS ]</button>
      <button class="drawer-btn" data-drawer-action="wallpaper" data-testid="drawer-btn-wallpaper">[ WALLPAPER ON/OFF ]</button>
    </nav>
    <section class="drawer-section">
      <h3>PREFERÊNCIAS</h3>
      <label class="drawer-toggle"><input type="checkbox" data-pref="inApp" data-testid="pref-inApp"  checked> Toast in-app</label>
      <label class="drawer-toggle"><input type="checkbox" data-pref="native" data-testid="pref-native" checked> Notificação do sistema</label>
      <label class="drawer-toggle"><input type="checkbox" data-pref="sound" data-testid="pref-sound"  checked> Som ao receber resposta</label>
    </section>
    <footer class="drawer-footer">
      <span id="drawer-perm">nível: —</span>
    </footer>
  </aside>

  <!-- ── DESKTOP ─────────────────────────────────────────── -->
  <div id="desktop" style="margin-top:28px;">
    <div id="wallpaper"></div>
    <div id="windows-container"></div>
  </div>

  <!-- ── TASKBAR ─────────────────────────────────────────── -->
  <div id="taskbar">
    <button class="taskbar-btn" onclick="openTerminal()">[ TERMINAL ]</button>
    <button class="taskbar-btn" onclick="openSysMon()">[ SYSMON ]</button>
    <button class="taskbar-btn" id="remote-access-toggle">[ ACESSO REMOTO: DESATIVADO ]</button>
    <button class="taskbar-btn" id="unlimited-steps-toggle">[ AÇÕES ILIMITADAS: DESATIVADO ]</button>
    <button class="taskbar-btn" id="btn-wallpaper" onclick="toggleWallpaper()">[ WALLPAPER ON ]</button>
    <span class="taskbar-clock" id="clock">00:00:00</span>
  </div>

  <!-- ── TEMPLATE: TERMINAL ──────────────────────────────── -->
  <template id="tpl-terminal">
    <div class="os-window" style="width:680px;height:420px;top:60px;left:60px;">
      <div class="os-window-titlebar" data-drag>
        <span class="os-window-title">TERMINAL // ARIS-9</span>
        <button class="win-ctrl" data-action="minimize">─</button>
        <button class="win-ctrl close" data-action="close">✕</button>
      </div>
      <div class="os-window-body">
        <div class="terminal-output" id="terminal-output" data-testid="terminal-output"></div>
        <div class="terminal-input-row">
          <span class="terminal-prefix" id="terminal-prefix">ARIS@OS ~$</span>
          <input type="text" id="terminal-input" data-testid="terminal-input" autocomplete="off" spellcheck="false"
                 placeholder="comando ou mensagem para o ARIS-9...">
        </div>
      </div>
    </div>
  </template>

  <!-- ── TEMPLATE: MONITOR DE SISTEMA ───────────────────── -->
  <template id="tpl-sysmon">
    <div class="os-window" style="width:360px;height:310px;top:60px;left:780px;">
      <div class="os-window-titlebar" data-drag>
        <span class="os-window-title">MONITOR DE SISTEMA</span>
        <button class="win-ctrl" data-action="minimize">─</button>
        <button class="win-ctrl close" data-action="close">✕</button>
      </div>
      <div class="os-window-body sysmon-body">
        <div class="sysmon-row">
          <label>CPU</label>
          <div class="progress-bar"><div class="progress-fill" id="sm-cpu-bar" style="width:0%"></div></div>
          <div class="sysmon-value" id="sm-cpu-val">—</div>
        </div>
        <div class="sysmon-row">
          <label>RAM</label>
          <div class="progress-bar"><div class="progress-fill" id="sm-ram-bar" style="width:0%"></div></div>
          <div class="sysmon-value" id="sm-ram-val">—</div>
        </div>
        <div class="sysmon-row">
          <label>DISCO</label>
          <div class="progress-bar"><div class="progress-fill" id="sm-disk-bar" style="width:0%"></div></div>
          <div class="sysmon-value" id="sm-disk-val">—</div>
        </div>
        <div class="sysmon-grid">
          <div>HOST</div>   <span id="sm-host">...</span>
          <div>CPU</div>    <span id="sm-cpu-model">...</span>
          <div>CORES</div>  <span id="sm-cores">...</span>
          <div>UPTIME</div> <span id="sm-uptime">...</span>
        </div>
      </div>
    </div>
  </template>

  <!-- ── CONTAINER DE NOTIFICAÇÕES (TOAST) ──────────────── -->
  <div id="notification-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ── SCRIPTS ─────────────────────────────────────────── -->
  <!-- 1. mock-api.js PRIMEIRO — cria window.api antes de tudo -->
  <script src="js/mock-api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/core/permissions.js"></script>
  <script src="js/core/ToolManager.js"></script>
  <script>
    window.toolsReady = window.signalisAuth.whenAuthenticated()
      .then(() => window.toolManager.discover())
      .catch(error => console.warn('[SIGNALIS-OS] Falha ao carregar tools:', error))
  </script>
  <script src="js/agent.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/sysmon.js"></script>
  <script src="js/desktop.js"></script>

  <script>
    // ── Ações Ilimitadas ──────────────────────────────────────
    window.UNLIMITED_STEPS = false

    function _setUnlimitedSteps(enabled) {
      window.UNLIMITED_STEPS = enabled
      const btn = document.getElementById('unlimited-steps-toggle')
      if (!btn) return
      btn.textContent = enabled ? '[ AÇÕES ILIMITADAS: ATIVO ]' : '[ AÇÕES ILIMITADAS: DESATIVADO ]'
      btn.classList.toggle('unlimited-active', enabled)
    }

    document.getElementById('unlimited-steps-toggle').addEventListener('click', () => {
      _setUnlimitedSteps(!window.UNLIMITED_STEPS)
    })

    // Ativa automaticamente para usuário GOD ao autenticar
    window.signalisAuth.whenAuthenticated().then(status => {
      if (status?.permissionLevel === 'god') {
        _setUnlimitedSteps(true)
      }
    })

    // Abre o terminal automaticamente ao carregar
    window.addEventListener('load', () => {
      window.toolsReady.then(() => setTimeout(openTerminal, 300))
    })

    // ── Menu Hamburger (mobile) ──────────────────────────────
    ;(function () {
      const drawer   = document.getElementById('mobile-drawer')
      const backdrop = document.getElementById('mobile-drawer-backdrop')
      if (!drawer || !backdrop) return

      function open() {
        drawer.classList.add('open')
        backdrop.classList.add('open')
        document.body.classList.add('drawer-open')
        _refreshDrawerState()
      }
      function close() {
        drawer.classList.remove('open')
        backdrop.classList.remove('open')
        document.body.classList.remove('drawer-open')
      }
      window.toggleMobileDrawer = () => {
        drawer.classList.contains('open') ? close() : open()
      }
      window.closeMobileDrawer = close

      // Ações dos botões
      drawer.querySelectorAll('[data-drawer-action]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const act = btn.dataset.drawerAction
          close()
          switch (act) {
            case 'terminal':   if (typeof openTerminal === 'function') openTerminal();  break
            case 'sysmon':     if (typeof openSysMon   === 'function') openSysMon();    break
            case 'wallpaper':  if (typeof toggleWallpaper === 'function') toggleWallpaper(); break
            case 'workspaces': _quickList('browser.workspace.list', 'WORKSPACES', 'name', 'description'); break
            case 'macros':     _quickList('macro.list',              'MACROS',     'name', 'trigger');     break
          }
        })
      })

      // Preferências de notificação
      drawer.querySelectorAll('input[data-pref]').forEach(chk => {
        const key = chk.dataset.pref
        chk.addEventListener('change', () => {
          if (typeof window.setNotificationPref === 'function') {
            window.setNotificationPref(key, chk.checked)
          }
        })
      })

      // Fecha com ESC
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && drawer.classList.contains('open')) close()
      })

      // Se o usuário girar para desktop enquanto o drawer estava aberto, fecha
      window.matchMedia('(min-width: 769px)').addEventListener('change', e => {
        if (e.matches) close()
      })

      async function _refreshDrawerState() {
        // sincroniza checkboxes com preferências atuais
        if (typeof window.getNotificationPrefs === 'function') {
          const prefs = window.getNotificationPrefs()
          drawer.querySelectorAll('input[data-pref]').forEach(chk => {
            const key = chk.dataset.pref
            if (key in prefs) chk.checked = !!prefs[key]
          })
        }
        // nível de permissão
        try {
          const perm = window.permissionManager?.name
          const el = document.getElementById('drawer-perm')
          if (el && perm) el.textContent = `nível: ${perm}`
        } catch { /* ignora */ }
      }

      async function _quickList(toolName, title, primaryKey, secondaryKey) {
        // Abre o terminal (se necessário) e imprime a listagem
        try {
          if (typeof openTerminal === 'function') openTerminal()
          await window.toolsReady
          const list = await window.toolManager.execute(toolName, {}, { source: 'drawer' })
          const out = document.querySelector('.terminal-output')
          if (!out) return
          const line = (h) => { const d = document.createElement('div'); d.innerHTML = h; out.appendChild(d) }
          line(`<span class="t-dim">── ${title} (${list.length}) ────────────</span>`)
          if (!list.length) {
            line('<span class="t-dim">(vazio)</span>')
          } else {
            list.forEach(it => {
              const p = it[primaryKey] || '?'
              const s = it[secondaryKey] || ''
              line(`  <span class="t-aris">${p}</span> <span class="t-dim">${s ? '— ' + s : ''}</span>`)
            })
          }
          out.scrollTop = out.scrollHeight
        } catch (err) {
          console.warn('[drawer]', err)
        }
      }
    })()
  </script>

</body>
</html>
